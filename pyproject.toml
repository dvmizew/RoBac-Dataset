[project]
name = "robac-dataset"
version = "0.1.0"
description = "Curated dataset and evaluation pipeline for Romanian National Baccalaureate exams and rubrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pymupdf>=1.23.0",
    "pydantic>=2.0",
    "scikit-learn>=1.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pymupdf",
    "sklearn.*",
]
ignore_missing_imports = true
